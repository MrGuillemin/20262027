<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>✍️ Mots à connaître — Wayang Kulit — Révision Quest</title><link rel="stylesheet" href="../style.css"><style>.answerinput{width:100%;box-sizing:border-box;padding:14px;border:2px solid #bbc5d5;border-radius:10px;font-size:1.15rem}.help{color:#576477;font-size:.95rem;margin:10px 0}.answerbtn{margin-top:12px}.correct{color:#167245}.incorrect{color:#a12828}.options button{display:block;width:100%;margin:8px 0}.hidden{display:none!important}</style></head><body><main><section class="top"><h1>✍️ Mots à connaître — Wayang Kulit</h1><p>Orthographe française : écrire les mots de la fiche de mémoire.</p></section><section id="menu" class="card"><div class="breadcrumb"><a href="../index.html">Accueil</a> › <a href="../francais/">Français</a> › <a href="index.html">Vocabulaire</a> › Wayang Kulit</div><div class="grid"><button class="tile" onclick="start(0)"><b>✍️ Tous les mots</b>Écris les mots de mémoire, sans choix proposés.</button><button class="tile" onclick="start(1)"><b>✍️ Noms</b>Écris les mots de mémoire, sans choix proposés.</button><button class="tile" onclick="start(2)"><b>✍️ Verbes</b>Écris les mots de mémoire, sans choix proposés.</button><button class="tile" onclick="start(3)"><b>✍️ Adjectifs</b>Écris les mots de mémoire, sans choix proposés.</button><button class="tile" onclick="start(4)"><b>✍️ Mots invariables</b>Écris les mots de mémoire, sans choix proposés.</button></div><p class="tip">🎲 10 questions tirées au hasard à chaque partie. Correction immédiate.</p></section><section id="game" class="card hidden"><div class="stats"><span id="mode"></span><span id="counter"></span></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="prompt"></h2><p id="hint" class="help"></p><div id="area"></div><div id="feedback" aria-live="polite"></div><p><button class="secondary" onclick="home()">← Exercices</button> <button class="primary hidden" id="next" onclick="advance()">Suivant →</button></p></section><section id="result" class="card hidden"><h2>Résultat</h2><div id="bigscore" class="bigscore"></div><div id="stars" class="stars"></div><p id="resultText"></p><button class="primary" onclick="start(modeIndex)">Rejouer</button> <button class="secondary" onclick="home()">Exercices</button></section><footer><a href="index.html">← Retour</a></footer></main><script src="../app.js"></script><script>const words=[["Indonésie", "nom", "Pays où se déroule le spectacle étudié"], ["art", "nom", "Création artistique, comme le théâtre"], ["artiste", "nom", "Personne qui pratique un art"], ["spectacle", "nom", "Représentation donnée devant un public"], ["spectateur", "nom", "Personne qui regarde un spectacle"], ["geste", "nom", "Mouvement du corps ou de la main"], ["drap", "nom", "Grand morceau de tissu"], ["lampe", "nom", "Objet qui produit de la lumière"], ["théâtre", "nom", "Art de jouer une pièce devant un public"], ["marionnette", "nom", "Personnage manipulé pour raconter une histoire"], ["ombre", "nom", "Zone sombre produite quand la lumière est arrêtée"], ["marionnettiste", "nom", "Personne qui manipule des marionnettes"], ["instrument", "nom", "Objet utilisé pour jouer de la musique"], ["musicien", "nom", "Personne qui joue de la musique"], ["récit", "nom", "Histoire racontée"], ["chant", "nom", "Action de chanter ou morceau chanté"], ["pièce", "nom", "Œuvre jouée au théâtre"], ["pays", "nom", "Territoire d’un État"], ["habitant", "nom", "Personne qui vit dans un lieu"], ["événement", "nom", "Fait marquant qui se produit"], ["mariage", "nom", "Union célébrée entre deux personnes"], ["projet", "nom", "Ce qu’on prévoit de réaliser"], ["représentation", "nom", "Séance où l’on présente un spectacle"], ["assister", "verbe", "Être présent à un spectacle"], ["raconter", "verbe", "Dire une histoire"], ["jouer", "verbe", "Interpréter une pièce ou pratiquer un jeu"], ["accompagner", "verbe", "Aller avec quelqu’un"], ["durer", "verbe", "Se prolonger pendant un certain temps"], ["voir", "verbe", "Percevoir avec les yeux"], ["précis", "adjectif", "Qui est exact, sans approximation"], ["blanc", "adjectif", "De la couleur de la neige"], ["véritable", "adjectif", "Qui est authentique, réel"], ["long", "adjectif", "Qui a une grande longueur"], ["collectif", "adjectif", "Qui concerne un groupe"], ["important", "adjectif", "Qui a beaucoup de valeur ou d’importance"], ["divertissant", "adjectif", "Qui amuse et distrait"], ["derrière", "invariable", "À l’arrière de quelque chose"], ["devant", "invariable", "En face, à l’avant"], ["tandis que", "invariable", "Expression qui marque deux actions simultanées ou opposées"], ["ensemble", "invariable", "Avec d’autres personnes, en groupe"], ["parfois", "invariable", "De temps en temps"], ["lors", "invariable", "Dans l’expression « … de » pour indiquer un moment"], ["dans", "invariable", "À l’intérieur de"], ["comme", "invariable", "Mot qui sert à établir une comparaison"]];const groups=['Tous les mots','Noms','Verbes','Adjectifs','Mots invariables'];let modeIndex=0,deck=[],n=0,score=0,locked=false;const E=id=>document.getElementById(id);function norm(s){return s.toLowerCase().normalize('NFC').replace(/’/g,"'").replace(/\s+/g,' ').trim()}function home(){E('menu').classList.remove('hidden');E('game').classList.add('hidden');E('result').classList.add('hidden')}function start(i){modeIndex=i;let group=['all','nom','verbe','adjectif','invariable'][i];let eligible=words.filter(w=>group==='all'||w[1]===group);deck=shuffle(eligible);n=0;score=0;E('menu').classList.add('hidden');E('result').classList.add('hidden');E('game').classList.remove('hidden');advance()}function advance(){if(n>=Math.min(10,deck.length)){E('game').classList.add('hidden');E('result').classList.remove('hidden');renderResult(score,n);saveBest('fr-orthographe-wayang-'+modeIndex,score);return}locked=false;let w=deck[n];E('mode').textContent=groups[modeIndex];E('counter').textContent=(n+1)+'/'+Math.min(10,deck.length);E('bar').style.width=(n/Math.min(10,deck.length)*100)+'%';E('prompt').textContent=w[2];E('hint').textContent='Écris le mot de la fiche ('+w[1]+'). Accents et orthographe comptent.';E('feedback').textContent='';E('next').classList.add('hidden');E('area').innerHTML='';let inp=document.createElement('input');inp.className='answerinput';inp.autocomplete='off';inp.spellcheck=false;inp.placeholder='Écris le mot sans modèle';inp.setAttribute('aria-label','Mot à orthographier');let btn=document.createElement('button');btn.className='primary answerbtn';btn.textContent='Vérifier';function check(){if(locked)return;let ans=inp.value;if(!ans.trim())return;locked=true;let ok=norm(ans)===norm(w[0]);if(ok)score++;E('feedback').className=ok?'correct':'incorrect';E('feedback').textContent=ok?'✅ Exact : '+w[0]:'❌ Tu as écrit « '+ans+' ». Orthographe attendue : '+w[0]+'. Relis bien les lettres et les accents.';E('next').classList.remove('hidden');inp.disabled=true;btn.disabled=true}btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check()}};E('area').append(inp,btn);inp.focus();n++}</script></body></html>
