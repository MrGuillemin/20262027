<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📚 Dictionnaire et ordre alphabétique — Révision Quest</title><link rel="stylesheet" href="../style.css"></head><body><main>
<section class="top"><h1>📚 Dictionnaire et ordre alphabétique</h1><p>Apprendre à chercher un mot et à lire un article de dictionnaire.</p></section>
<section id="menu" class="card"><div class="breadcrumb"><a href="../index.html">Accueil</a> › <a href="index.html">Vocabulaire</a></div>
<div class="grid">
<button class="tile" onclick="start(0)"><b>⭐ Niveau 1 · Je connais</b>Retrouver les connaissances de la leçon.</button>
<button class="tile" onclick="start(1)"><b>⭐⭐ Niveau 2 · J’applique</b>Utiliser la règle dans des exemples nouveaux.</button>
<button class="tile" onclick="start(2)"><b>⭐⭐⭐ Niveau 3 · Je raisonne</b>Choisir, analyser et éviter les pièges.</button>
</div><div class="tip"><b>🎯 Progression :</b> mémoriser → appliquer → raisonner. Les questions sont différentes à chaque niveau.</div></section>
<section id="game" class="card hidden"><div class="stats"><span id="ln"></span><span id="count"></span></div><div class="progress"><div id="bar" class="bar"></div></div>
<p id="inst" class="instruction"></p><div id="question" class="question"></div><div id="opts" class="options"></div><div id="fb" class="feedback hidden"></div>
<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="secondary" onclick="home()">← Niveaux</button><button id="nextBtn" class="primary hidden" onclick="nextQ()">Suivante →</button></div></section>
<section id="result" class="card hidden"><h2 style="text-align:center">Résultat</h2><div id="bigscore" class="bigscore"></div><div id="stars" class="stars"></div><p id="resultText" style="text-align:center"></p>
<div style="text-align:center"><button class="primary" onclick="start(level)">Rejouer</button> <button class="secondary" onclick="home()">Niveaux</button></div></section>
<footer><a href="index.html">← Retour à Vocabulaire</a></footer></main><script src="../app.js"></script><script>
const L=[[{"q": "Combien de lettres compte l’alphabet français ?", "a": "26", "o": ["24", "25", "26", "27"], "e": "L’alphabet français compte 26 lettres."}, {"q": "Combien y a-t-il de voyelles dans l’alphabet étudié dans la leçon ?", "a": "6", "o": ["5", "6", "7", "8"], "e": "La leçon indique 6 voyelles."}, {"q": "Dans un dictionnaire, les mots sont classés…", "a": "par ordre alphabétique", "o": ["par ordre alphabétique", "du plus court au plus long", "par nombre de syllabes", "par classe grammaticale"], "e": "Les mots sont classés selon l’ordre des lettres de l’alphabet."}, {"q": "Pour chercher plusieurs mots commençant par la même lettre, on observe…", "a": "les lettres suivantes", "o": ["les lettres suivantes", "leur longueur", "leur nombre de syllabes", "leur terminaison"], "e": "On compare les lettres une à une jusqu’à trouver une différence."}, {"q": "Dans le dictionnaire, un nom est présenté…", "a": "au singulier", "o": ["au singulier", "au pluriel", "au féminin uniquement", "dans une phrase"], "e": "Les noms sont généralement présentés au singulier."}, {"q": "Dans le dictionnaire, un verbe est présenté…", "a": "à l’infinitif", "o": ["au présent", "à l’infinitif", "au passé composé", "à l’impératif"], "e": "Pour chercher un verbe, on revient à son infinitif."}, {"q": "Quelle information indique « n. » ?", "a": "nom", "o": ["nom", "verbe", "adjectif", "pluriel"], "e": "« n. » est l’abréviation de nom."}, {"q": "Quelle information indique « v. » ?", "a": "verbe", "o": ["nom", "verbe", "adjectif", "féminin"], "e": "« v. » est l’abréviation de verbe."}, {"q": "Quelle information indique « adj. » ?", "a": "adjectif", "o": ["nom", "verbe", "adjectif", "masculin"], "e": "« adj. » signifie adjectif."}, {"q": "L’étymologie d’un mot indique…", "a": "son origine", "o": ["son origine", "sa longueur", "son pluriel", "son contraire"], "e": "L’étymologie renseigne sur l’origine du mot."}], [{"q": "Quel mot vient en premier dans le dictionnaire ?", "a": "chat", "o": ["chat", "chèvre", "chien", "chou"], "e": "Après « ch », on compare la troisième lettre : a vient avant è, i et o."}, {"q": "Quel mot vient en dernier ?", "a": "zèbre", "o": ["wagon", "xylophone", "yaourt", "zèbre"], "e": "W, X, Y puis Z : « zèbre » vient donc en dernier."}, {"q": "Tu veux chercher « maisons ». Quel mot d’entrée cherches-tu ?", "a": "maison", "o": ["maison", "maisons", "maisonner", "maisonnée"], "e": "Un nom est recherché au singulier."}, {"q": "Tu veux chercher « trouvaient ». Quel mot d’entrée cherches-tu ?", "a": "trouver", "o": ["trouve", "trouver", "trouvait", "trouvaient"], "e": "Un verbe est recherché à l’infinitif."}, {"q": "Dans un article, quelle partie explique le sens du mot ?", "a": "la définition", "o": ["le mot d’entrée", "la nature", "la définition", "l’exemple"], "e": "La définition donne le sens du mot."}, {"q": "Dans un article, quelle partie montre le mot employé dans une phrase ?", "a": "l’exemple", "o": ["la nature", "l’étymologie", "le synonyme", "l’exemple"], "e": "L’exemple montre le mot en contexte."}, {"q": "Quel élément indique si « débarquer » est un nom, un verbe ou un adjectif ?", "a": "la nature du mot", "o": ["le mot d’entrée", "la nature du mot", "la définition", "le contraire"], "e": "La nature indique la classe grammaticale."}, {"q": "Quel mot vient d’abord ?", "a": "cabane", "o": ["cabane", "cacao", "cadeau", "café"], "e": "On compare lettre par lettre : cab… vient avant cac…, cad… et caf…."}, {"q": "Pour chercher « belles » dans un dictionnaire, on cherche généralement…", "a": "beau", "o": ["belle", "belles", "beau", "beaux"], "e": "Un adjectif est généralement présenté au masculin singulier."}, {"q": "Que signifie « SYN. » dans un article de dictionnaire ?", "a": "synonyme", "o": ["singulier", "synonyme", "syntaxe", "symbole"], "e": "« SYN. » annonce un mot de sens proche."}], [{"q": "Quel classement est correctement alphabétique ?", "a": "chat – chèvre – chien", "o": ["chat – chèvre – chien", "chien – chat – chèvre", "chèvre – chien – chat", "chat – chien – chèvre"], "e": "On compare les lettres successives : cha…, chè…, chi…."}, {"q": "Quel classement est correctement alphabétique ?", "a": "car – carte – carton", "o": ["car – carte – carton", "carte – car – carton", "carton – carte – car", "car – carton – carte"], "e": "Quand un mot est entièrement contenu au début d’un autre, le mot le plus court vient d’abord ; puis on compare les lettres suivantes."}, {"q": "On lit « débarquer v. ». Que peut-on affirmer ?", "a": "« débarquer » est un verbe", "o": ["« débarquer » est un nom", "« débarquer » est un verbe", "« débarquer » est un adjectif", "« débarquer » est au pluriel"], "e": "L’abréviation « v. » indique un verbe."}, {"q": "Un article donne « décharger » après « SYN. ». Quel lien unit les deux mots ?", "a": "Ils ont un sens proche", "o": ["Ils ont un sens proche", "Ils ont un sens contraire", "Ils ont la même orthographe", "Ils ont la même étymologie"], "e": "Un synonyme est un mot de sens proche."}, {"q": "Quel élément d’un article te permettrait de connaître l’origine latine d’un mot ?", "a": "l’étymologie", "o": ["la définition", "l’exemple", "l’étymologie", "le contraire"], "e": "L’étymologie étudie l’origine des mots."}, {"q": "Tu ne trouves pas « couraient » dans le dictionnaire. Quelle stratégie est correcte ?", "a": "Chercher l’infinitif « courir »", "o": ["Chercher « couraient » au pluriel", "Chercher l’infinitif « courir »", "Chercher « course »", "Chercher « couru »"], "e": "Une forme conjuguée doit être ramenée à l’infinitif."}, {"q": "Tu ne trouves pas « chevaux ». Quelle stratégie est correcte ?", "a": "Chercher « cheval »", "o": ["Chercher « chevaux »", "Chercher « cheval »", "Chercher « chevalier »", "Chercher « chevaucher »"], "e": "Les noms sont présentés au singulier."}, {"q": "Quel mot faut-il chercher pour connaître le sens de « heureuses » ?", "a": "heureux", "o": ["heureuse", "heureuses", "heureux", "heureusement"], "e": "L’adjectif est recherché sous sa forme masculine singulière."}, {"q": "Quel mot vient juste avant les autres ?", "a": "branche", "o": ["branche", "bravo", "bras", "brume"], "e": "« bran… » vient avant « bras… », « brav… » et « bru… »."}, {"q": "Pour départager « plante » et « plage », quelle lettre faut-il comparer en premier après « pla » ?", "a": "n et g", "o": ["p et p", "l et l", "a et a", "n et g"], "e": "Les trois premières lettres sont identiques ; la première différence est n/g."}]];const names=["Niveau 1 · Je connais","Niveau 2 · J’applique","Niveau 3 · Je raisonne"];
const instructions=["Retrouve précisément la leçon.","Applique la règle à un nouvel exemple.","Observe bien : les mauvaises réponses sont plausibles."];
let level=0,n=0,score=0,order=[],cur=null,answered=false;const E=id=>document.getElementById(id);
function start(l){level=l;n=0;score=0;order=shuffle([...Array(L[l].length).keys()]);E("menu").classList.add("hidden");E("result").classList.add("hidden");E("game").classList.remove("hidden");E("ln").textContent=names[l];E("inst").textContent=instructions[l];nextQ()}
function home(){E("game").classList.add("hidden");E("result").classList.add("hidden");E("menu").classList.remove("hidden")}
function nextQ(){if(n>=order.length)return finish();answered=false;cur=L[level][order[n++]];E("count").textContent=n+"/"+order.length;E("bar").style.width=((n-1)/order.length*100)+"%";E("question").textContent=cur.q;E("fb").className="feedback hidden";E("nextBtn").classList.add("hidden");E("opts").innerHTML="";shuffle(cur.o).forEach(x=>{let b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>check(x);E("opts").appendChild(b)})}
function check(x){if(answered)return;answered=true;let ok=x===cur.a,f=E("fb");f.classList.remove("hidden");if(ok){score++;f.classList.add("good");f.innerHTML="✅ <b>Bravo !</b><br>"+cur.e}else{f.classList.add("bad");f.innerHTML="❌ <b>Pas tout à fait.</b><br>La bonne réponse est <b>"+cur.a+"</b>.<br>"+cur.e}E("bar").style.width=(n/order.length*100)+"%";E("nextBtn").classList.remove("hidden")}
function finish(){E("game").classList.add("hidden");E("result").classList.remove("hidden");renderResult(score,order.length);saveBest("voc-dico-"+level,score)}
</script></body></html>
