function inputPool(title,en,fr,data){const chosen=shuffle(data).slice(0,10),box=document.createElement('section');box.className='card';box.innerHTML=`<h2>${title}</h2><p><b>${en}</b><br><span class="fr">${fr}</span></p>`;chosen.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML=`<b>${i+1}.</b> ${x[0].replace('___','<input>')} <span class="feedback"></span>`;box.appendChild(d)});controls(box,chosen,(d,x)=>norm(d.querySelector('input').value)===norm(x[1]),x=>x[1]);return box}

function choiceEx(){const chosen=shuffle(choose).slice(0,10),box=document.createElement('section');box.className='card';box.innerHTML='<h2>Exercise 2 — Choose the correct form</h2><p><b>Choose the correct form of the verb according to the situation.</b><br><span class="fr">Choisis la forme correcte du verbe en fonction de la situation.</span></p>';chosen.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML=`<b>${i+1}.</b> ${x[0]} <select><option value="">Choose…</option><option>${x[1]}</option><option>${x[2]}</option><option>${x[3]}</option></select> <span class="feedback"></span>`;box.appendChild(d)});controls(box,chosen,(d,x)=>d.querySelector('select').value===x[x[4]+1],x=>x[x[4]+1]);return box}

function story(){const box=document.createElement('section');box.className='card';box.innerHTML='<h2>Exercise 5 — From travel notes to a story</h2><p><b>Write complete sentences in the past simple. You may choose a suitable subject and add the necessary small words.</b><br><span class="fr">À partir des notes, rédige des phrases complètes au prétérit. Plusieurs formulations sont possibles.</span></p>';notes.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML=`<b>${i+1}.</b> <i>${x[0]}</i><br><textarea rows="2"></textarea><br><span class="feedback"></span>`;box.appendChild(d)});let sc=document.createElement('div');sc.className='score';let b=document.createElement('button');b.textContent='Check my sentences';b.onclick=()=>{let t=0;box.querySelectorAll('.q').forEach((d,i)=>{let v=norm(d.querySelector('textarea').value),f=d.querySelector('.feedback'),verbs=['start','walk','take','drive','see','visit','spend','ride','be','want'];let base=notes[i][0].toLowerCase();let expected=[];if(base.includes('start'))expected=['started'];if(base.includes('walk'))expected=['walked','took'];if(base.includes('drive'))expected=['drove'];if(base.includes('see'))expected=['saw'];if(base.includes('not visit'))expected=["didn't visit",'did not visit'];if(base.includes('spend'))expected=['spent'];if(base.includes('ride'))expected=['rode'];if(base.includes('exhausted'))expected=['were','was'];let ok=v.length>12 && expected.some(e=>v.includes(e));if(base.includes('not visit'))ok=v.length>12&&(v.includes("didn't visit")||v.includes('did not visit'));f.innerHTML=ok?'✓ Good. Your sentence uses the expected past form.':`Check the past simple. <span class="model">Possible answer: ${notes[i][1]}</span>`;f.className='feedback '+(ok?'ok':'hint');if(ok)t++});sc.textContent=`Guided check: ${t}/8 sentences contain the expected past form.`};let r=document.createElement('button');r.textContent='Clear and try again';r.onclick=()=>location.reload();box.append(b,r,sc);return box}

function translation(){const chosen=shuffle(trans).slice(0,10),box=document.createElement('section');box.className='card';box.innerHTML='<h2>Exercise 6 — Translate into English</h2><p><b>Translate into English.</b><br><span class="fr">Traduis en anglais.</span></p>';chosen.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML=`<b>${i+1}.</b> ${x[0]} →<br><input class="wide"> <span class="feedback"></span>`;box.appendChild(d)});controls(box,chosen,(d,x)=>{let a=norm(d.querySelector('input').value).replace("didn't",'did not').replace('a lot of','lots of');let b=norm(x[1]).replace("didn't",'did not').replace('a lot of','lots of');return a===b},x=>x[1]);return box}
