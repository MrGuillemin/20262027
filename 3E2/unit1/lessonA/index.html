function translation(){const chosen=shuffle(trans).slice(0,10),box=document.createElement('section');box.className='card';box.innerHTML='<h2>Exercise 3 — Wishes, plans and purposes</h2><p><b>Translate into English. Choose the appropriate structure and pay attention to purpose.</b><br><span class="fr">Traduis en anglais. Choisis la structure appropriée et fais attention à l’expression du but.</span></p>';chosen.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML=`<b>${i+1}.</b> ${x.q}<br><input class="wide" placeholder="Write your translation here…"> <span class="feedback"></span>`;box.appendChild(d)});let sc=document.createElement('div');sc.className='score';let b=document.createElement('button');b.textContent='Check answers';b.onclick=()=>{let t=0;box.querySelectorAll('.q').forEach((d,i)=>{let inp=d.querySelector('input'),f=d.querySelector('.feedback'),ok=chosen[i].a.some(a=>norm(inp.value)===norm(a));f.textContent=ok?'✓':'✗ Possible answer: '+chosen[i].a[0];f.className='feedback '+(ok?'ok':'bad');if(ok)t++});sc.textContent=`Score: ${t}/${chosen.length}`};let r=document.createElement('button');r.textContent='Try again';r.onclick=()=>location.reload();box.append(b,r,sc);return box}

function chronology(){const box=document.createElement('section');box.className='card';box.innerHTML='<h2>Exercise 4 — Rebuild the road trip</h2><p><b>The stages of the road trip are in the wrong order. Use the clues to put them in the correct order. Then add an appropriate chronological connector and write the order of each stage.</b><br><span class="fr">Les étapes du road trip sont dans le désordre. Utilise les indices pour les remettre dans l’ordre. Ajoute ensuite un connecteur chronologique adapté et indique l’ordre de chaque étape.</span></p><p><b>To begin with / First – Then – Next – Finally / To finish</b></p>';shuffle(stages).forEach(([txt,order])=>{let d=document.createElement('div');d.className='stage';d.dataset.order=order;let expected=order===1?'first':order===8?'final':'middle';d.dataset.connector=expected;d.innerHTML=`<select class="conn"><option value="">Connector…</option><option value="first">To begin with / First</option><option value="middle">Then / Next</option><option value="final">Finally / To finish</option></select> ${txt} <select class="ord"><option value="">Order…</option>${[1,2,3,4,5,6,7,8].map(n=>`<option>${n}</option>`).join('')}</select> <span class="feedback"></span>`;box.appendChild(d)});let sc=document.createElement('div');sc.className='score';let b=document.createElement('button');b.textContent='Check answers';b.onclick=()=>{let t=0;box.querySelectorAll('.stage').forEach(d=>{let orderOk=d.querySelector('.ord').value===d.dataset.order, connOk=d.querySelector('.conn').value===d.dataset.connector,ok=orderOk&&connOk,f=d.querySelector('.feedback');f.textContent=ok?'✓':`✗ order ${d.dataset.order}`;f.className='feedback '+(ok?'ok':'bad');if(ok)t++});sc.textContent=`Score: ${t}/8`};let r=document.createElement('button');r.textContent='Try again';r.onclick=()=>location.reload();box.append(b,r,sc);return box}
