<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎸 My Hobbies — Révision Quest</title><link rel="stylesheet" href="../style.css"><style>.answerinput{width:100%;box-sizing:border-box;padding:14px;border:2px solid #bbc5d5;border-radius:10px;font-size:1.15rem}.help{color:#576477;font-size:.95rem;margin:10px 0}.answerbtn{margin-top:12px}.correct{color:#167245}.incorrect{color:#a12828}.options button{display:block;width:100%;margin:8px 0}.hidden{display:none!important}</style></head><body><main><section class="top"><h1>🎸 My Hobbies</h1><p>Les dix activités de la fiche de Paul.</p></section><section id="menu" class="card"><div class="breadcrumb"><a href="../index.html">Accueil</a> › <a href="index.html">Anglais</a> › My Hobbies</div><div class="grid"><button class="tile english" onclick="start(0)"><b>🎯 Français vers anglais</b>10 activités différentes par partie.</button><button class="tile english" onclick="start(1)"><b>🔁 Anglais vers français</b>10 activités différentes par partie.</button><button class="tile english" onclick="start(2)"><b>🧩 Compléter une phrase</b>10 activités différentes par partie.</button></div><p class="tip">🎲 10 questions tirées au hasard à chaque partie. Correction immédiate.</p></section><section id="game" class="card hidden"><div class="stats"><span id="mode"></span><span id="counter"></span></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="prompt"></h2><p id="hint" class="help"></p><div id="area"></div><div id="feedback" aria-live="polite"></div><p><button class="secondary" onclick="home()">← Exercices</button> <button class="primary hidden" id="next" onclick="advance()">Suivant →</button></p></section><section id="result" class="card hidden"><h2>Résultat</h2><div id="bigscore" class="bigscore"></div><div id="stars" class="stars"></div><p id="resultText"></p><button class="primary" onclick="start(modeIndex)">Rejouer</button> <button class="secondary" onclick="home()">Exercices</button></section><footer><a href="index.html">← Retour</a></footer></main><script src="../app.js"></script><script>const words=[["swim", "nager"], ["play football", "jouer au football"], ["dance", "danser"], ["play rugby", "jouer au rugby"], ["ride a horse", "faire du cheval"], ["sing", "chanter"], ["draw", "dessiner"], ["play the guitar", "jouer de la guitare"], ["play the piano", "jouer du piano"], ["play the drums", "jouer de la batterie"]];const labels=['🇫🇷 → 🇬🇧','🇬🇧 → 🇫🇷','🧩 Complète la phrase'];let modeIndex=0,deck=[],n=0,score=0,locked=false;const E=id=>document.getElementById(id);function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ').trim()}function home(){E('menu').classList.remove('hidden');E('game').classList.add('hidden');E('result').classList.add('hidden')}function start(i){modeIndex=i;deck=shuffle(words);n=0;score=0;E('menu').classList.add('hidden');E('result').classList.add('hidden');E('game').classList.remove('hidden');advance()}function advance(){if(n===10){E('game').classList.add('hidden');E('result').classList.remove('hidden');renderResult(score,10);saveBest('hobbies-'+modeIndex,score);return}locked=false;let w=deck[n];E('mode').textContent=labels[modeIndex];E('counter').textContent=(n+1)+'/10';E('bar').style.width=n*10+'%';E('feedback').textContent='';E('next').classList.add('hidden');let answer,question;if(modeIndex===0){question='Comment dit-on « '+w[1]+' » en anglais ?';answer=w[0]}else if(modeIndex===1){question='Que signifie « '+w[0]+' » ?';answer=w[1]}else{question='Complète : I like to … ('+w[1]+')';answer=w[0]}E('prompt').textContent=question;E('hint').textContent='Choisis la bonne réponse.';let distract=shuffle(words.filter(x=>x!==w)).slice(0,3).map(x=>x[modeIndex===1?1:0]);let choices=shuffle([answer,...distract]);E('area').replaceChildren();choices.forEach(x=>{let b=document.createElement('button');b.className='option';b.textContent=x;b.onclick=()=>{if(locked)return;locked=true;if(norm(x)===norm(answer)){score++;E('feedback').className='correct';E('feedback').textContent='✅ Bonne réponse ! '+w[0]+' = '+w[1]+'.'}else{E('feedback').className='incorrect';E('feedback').textContent='❌ Réponse : '+answer+'. '+w[0]+' = '+w[1]+'.'}E('next').classList.remove('hidden')};E('area').appendChild(b)});n++}</script></body></html>
