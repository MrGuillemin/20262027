<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4E2 – Unit 1 – Lesson A</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f7fb;color:#182033}.wrap{max-width:900px;margin:auto;padding:24px}.top a{color:#4056a1;text-decoration:none}.card{background:#fff;border-radius:16px;padding:22px;margin:20px 0;box-shadow:0 3px 14px #00000012}.q{padding:14px 0;border-bottom:1px solid #e8eaf0}.q:last-child{border:0}select{font:inherit;padding:7px;border-radius:8px;margin:0 5px}button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;margin:10px 8px 0 0}.check{background:#243b75;color:white}.retry{background:#e8ebf3}.feedback{font-weight:700;margin-left:8px}.ok{color:#16803b}.bad{color:#b42318}.score{font-weight:800;margin-top:15px}.note{color:#586174}
</style></head><body><main class="wrap"><p class="top"><a href="../index.html">← Unit 1</a></p><h1>Lesson A</h1><p class="note">10 random questions per exercise. Check your answers, then try again for a new selection.</p><div id="app"></div></main>
<script>
const exercises=[
{title:'Exercise 1 — There is / There are',help:'Choose the correct form.',choices:['there is','there are',"there isn't any","there aren't any"],pool:[
['a large park in the city centre.','there is'],['two museums near the station.','there are'],['beaches in my city. ❌',"there aren't any"],['public transport at night. ❌',"there isn't any"],['some greenery near the lake.','there is'],['many modern buildings.','there are'],['a sports centre near my school.','there is'],['three parks in the city centre.','there are'],['a big shopping centre near the station.','there is'],['many restaurants in this neighbourhood.','there are'],['a swimming pool next to the park.','there is'],['two cinemas in my city.','there are'],['a library near my house.','there is'],['lots of shops in the city centre.','there are'],['a bus station near the museum.','there is'],['some beautiful gardens near the river.','there are'],['a skatepark for teenagers.','there is'],['many cafés around the main square.','there are'],['a lake near the city.','there is'],['several schools in this neighbourhood.','there are'],['cinema in my neighbourhood. ❌',"there isn't any"],['greenery near the station. ❌',"there isn't any"],['public transport on Sunday. ❌',"there isn't any"],['park near my house. ❌',"there isn't any"],['museum in this small town. ❌',"there isn't any"],['sports centres in my neighbourhood. ❌',"there aren't any"],['restaurants near the lake. ❌',"there aren't any"],['shops near my school. ❌',"there aren't any"],['cycle paths in this city. ❌',"there aren't any"],['modern buildings in the old town. ❌',"there aren't any"]]},
{title:'Exercise 2 — Can + BV',help:'Choose the correct verb form.',pool:[
['You can _____ the museum.',['visit','to visit','visiting'],'visit'],['Tourists can _____ the bus.',['take','to take','takes'],'take'],['You can _____ in the park.',['relax','relaxing','to relax'],'relax'],['People can _____ shopping in the city centre.',['go','goes','to go'],'go'],['You can _____ your friends in the park.',['meet','meeting','to meet'],'meet'],['Tourists can _____ photos of the city.',['take','takes','to take'],'take'],['You can _____ a bike near the station.',['rent','renting','to rent'],'rent'],['People can _____ in the lake.',['swim','swims','to swim'],'swim'],['Teenagers can _____ football in the park.',['play','playing','to play'],'play'],['You can _____ the city by bus.',['explore','explores','to explore'],'explore'],['Visitors can _____ local food.',['try','trying','to try'],'try'],['You can _____ to the cinema.',['go','goes','going'],'go'],['People can _____ in the city centre.',['shop','shopping','to shop'],'shop'],['You can _____ a picnic near the lake.',['have','having','to have'],'have'],['Tourists can _____ the old buildings.',['see','sees','to see'],'see'],['You can _____ the train to the city centre.',['take','takes','taking'],'take'],['Children can _____ in the playground.',['play','plays','to play'],'play'],['You can _____ books at the library.',['read','reading','to read'],'read'],['People can _____ along the river.',['walk','walks','to walk'],'walk'],['You can _____ your bike in the park.',['ride','rides','to ride'],'ride'],['Visitors can _____ the art museum.',['visit','visits','visiting'],'visit'],['You can _____ a coffee in the main square.',['drink','drinks','to drink'],'drink'],['Teenagers can _____ at the sports centre.',['exercise','exercises','to exercise'],'exercise'],['You can _____ your friends after school.',['see','sees','seeing'],'see'],['Tourists can _____ souvenirs.',['buy','buys','to buy'],'buy'],['People can _____ concerts in the city.',['enjoy','enjoys','to enjoy'],'enjoy'],['You can _____ the bus at the station.',['catch','catches','to catch'],'catch'],['Visitors can _____ in a hotel near the centre.',['stay','stays','staying'],'stay'],['You can _____ dinner in a restaurant.',['eat','eats','to eat'],'eat'],['People can _____ outside when the weather is nice.',['relax','relaxes','to relax'],'relax']]},
{title:'Exercise 3 — Need / Need to',help:'Choose needs or need to.',choices:['needs','need to'],pool:[
['A great city _____ parks and green spaces.','needs'],['You _____ have good public transport.','need to'],['A modern city _____ clean streets.','needs'],['You _____ protect green spaces.','need to'],['A great city _____ shops and restaurants.','needs'],['You _____ create places for teenagers.','need to'],['A city _____ good public transport.','needs'],['We _____ keep the streets clean.','need to'],['A great neighbourhood _____ a park.','needs'],['You _____ take the bus to get there.','need to'],['A modern city _____ cycle paths.','needs'],['We _____ protect the environment.','need to'],['A big city _____ good hospitals.','needs'],['People _____ respect public places.','need to'],['A great city _____ places for young people.','needs'],['You _____ walk for ten minutes to reach the park.','need to'],['The city _____ more trees.','needs'],['We _____ use public transport more often.','need to'],['A neighbourhood _____ local shops.','needs'],['You _____ cross the bridge to get to the museum.','need to'],['A city centre _____ pedestrian areas.','needs'],['We _____ create more green spaces.','need to'],['A great city _____ sports facilities.','needs'],['People _____ recycle their rubbish.','need to'],['A modern city _____ reliable buses.','needs'],['You _____ follow the rules in public places.','need to'],['The neighbourhood _____ a new library.','needs'],['We _____ make the city safer.','need to'],['A tourist city _____ good hotels.','needs'],['People _____ take care of parks and gardens.','need to']]},
{title:'Exercise 4 — And, but or also?',help:'Choose and, but or also.',choices:['and','but','also'],pool:[
['My city is modern _____ clean.','and'],["There are many shops, _____ there aren't any parks.",'but'],['You can visit museums. You can _____ relax in the park.','also'],['The city is lively _____ it is sometimes noisy.','but'],['The park is large _____ beautiful.','and'],['The city is interesting _____ very lively.','and'],['There is a museum _____ a cinema.','and'],['The streets are clean _____ safe.','and'],['The city has parks _____ sports centres.','and'],['The neighbourhood is quiet _____ pleasant.','and'],['You can walk _____ ride your bike.','and'],['There are cafés _____ restaurants near the station.','and'],['The city is beautiful _____ it is very expensive.','but'],['The park is small _____ it is very nice.','but'],["There are lots of buses _____ there isn't a train station.",'but'],['I like my neighbourhood _____ it is sometimes noisy.','but'],['The city centre is lively _____ it can be crowded.','but'],["There are many shops _____ there aren't any sports centres.",'but'],['The museum is interesting _____ it is quite small.','but'],['The city is modern _____ some streets are dirty.','but'],['You can visit the museum. You can _____ visit the castle.','also'],['There is a swimming pool. There is _____ a sports centre.','also'],['You can take the bus. You can _____ take the train.','also'],['The city has a museum. It _____ has a large library.','also'],['You can go shopping. You can _____ relax in the park.','also'],['There are restaurants. There are _____ many cafés.','also'],['You can walk along the river. You can _____ ride a bike.','also'],['The city has good public transport. It _____ has cycle paths.','also'],['Tourists can visit the old town. They can _____ visit the museum.','also'],['There is a cinema. There is _____ a theatre.','also']]}
];
function sample(a,n=10){return [...a].sort(()=>Math.random()-.5).slice(0,n)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderExercise(ex,idx){ex.current=sample(ex.pool);const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${ex.title}</h2><p>${ex.help}</p><div class="questions"></div><button class="check">Check answers</button><button class="retry">Try again</button><div class="score"></div>`;const qs=card.querySelector('.questions');ex.current.forEach((item,i)=>{let q,choices,ans;if(ex.choices){q=item[0];choices=ex.choices;ans=item[1]}else{q=item[0];choices=item[1];ans=item[2]}const d=document.createElement('div');d.className='q';let html=`<strong>${i+1}.</strong> `;if(q.includes('_____')){const parts=q.split('_____');html+=esc(parts[0])+`<select data-answer="${esc(ans)}"><option value="">— choose —</option>${choices.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`+esc(parts[1]||'')}else{html+=`<select data-answer="${esc(ans)}"><option value="">— choose —</option>${choices.map(c=>`<option>${esc(c)}</option>`).join('')}</select> `+esc(q)}html+=` <span class="feedback"></span>`;d.innerHTML=html;qs.appendChild(d)});card.querySelector('.check').onclick=()=>{let score=0;card.querySelectorAll('select').forEach(s=>{const f=s.parentElement.querySelector('.feedback');if(s.value===s.dataset.answer){score++;f.textContent='✓';f.className='feedback ok'}else{f.textContent=`✗ → ${s.dataset.answer}`;f.className='feedback bad'}});card.querySelector('.score').textContent=`Score: ${score}/10`};card.querySelector('.retry').onclick=()=>{const fresh=renderExercise(ex,idx);card.replaceWith(fresh)};return card}
const app=document.getElementById('app');exercises.forEach((e,i)=>app.appendChild(renderExercise(e,i)));
</script></body></html>
