<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4E3 – Unit 1 – Lesson C</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:30px auto;padding:0 18px}.back{color:#37548c;text-decoration:none}.card{background:white;padding:24px;border-radius:16px;margin:22px 0;box-shadow:0 3px 16px #0001}.question{padding:15px 0;border-bottom:1px solid #e5e9f1}label{display:block;margin-bottom:8px}input{font:inherit;box-sizing:border-box;width:100%;padding:10px;border:1px solid #bfc9d9;border-radius:9px}button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:11px 15px;margin:12px 8px 0 0;cursor:pointer}.check{background:#243b75;color:white}.retry{background:#e8ebf3}.reveal{background:#fff1c2}.ok{color:#17713b;font-weight:700}.warn{color:#a05c00}.model{color:#243b75;margin-top:6px;font-weight:700}.feedback{margin-top:6px}.score{font-weight:700}.muted{color:#64748b}</style></head><body><main class="wrap"><a class="back" href="../index.html">← Unit 1</a><h1>Lesson C — Comparatives & Superlatives</h1><p class="muted">Write your answers, check them, and try again. After three mistakes you can see a suggested answer.</p><div id="app"></div></main><script>const pools=[[["Toronto is _____ New York. (cold)", "colder than"], ["Sydney is _____ Edinburgh. (hot)", "hotter than"], ["London is _____ Auckland. (big)", "bigger than"], ["Melbourne is _____ Toronto. (lively)", "livelier than"], ["The Shard is _____ the CN Tower. (short)", "shorter than"], ["Auckland is _____ London. (small)", "smaller than"], ["Sydney is _____ Edinburgh. (modern)", "more modern than"], ["New York is _____ Toronto. (populated)", "more populated than"], ["London is _____ Toronto. (big)", "bigger than"], ["Auckland is _____ New York. (small)", "smaller than"], ["Sydney is _____ Toronto. (warm)", "warmer than"], ["Toronto is _____ Sydney. (cold)", "colder than"], ["The CN Tower is _____ the Shard. (high)", "higher than"], ["Edinburgh is _____ London. (quiet)", "quieter than"], ["New York is _____ Edinburgh. (busy)", "busier than"], ["Melbourne is _____ Edinburgh. (modern)", "more modern than"], ["Auckland is _____ Toronto. (green)", "greener than"], ["London is _____ Edinburgh. (populated)", "more populated than"], ["Sydney is _____ Edinburgh. (lively)", "livelier than"], ["The Shard is _____ the CN Tower. (short)", "shorter than"], ["New York is _____ Auckland. (big)", "bigger than"], ["Toronto is _____ Auckland. (populated)", "more populated than"], ["Edinburgh is _____ New York. (old)", "older than"], ["Melbourne is _____ Toronto. (warm)", "warmer than"], ["London is _____ Auckland. (busy)", "busier than"], ["Sydney is _____ Edinburgh. (famous)", "more famous than"], ["Auckland is _____ London. (quiet)", "quieter than"], ["New York is _____ Toronto. (expensive)", "more expensive than"], ["The CN Tower is _____ the Shard. (tall)", "taller than"], ["Melbourne is _____ Edinburgh. (large)", "larger than"]], [["The Shard is one of _____ buildings in London. (tall)", "the tallest"], ["January is _____ month in Toronto. (cold)", "the coldest"], ["Sydney is one of _____ cities in Australia. (famous)", "the most famous"], ["Auckland is one of _____ cities in New Zealand. (big)", "the biggest"], ["Summer is _____ season in Sydney. (hot)", "the hottest"], ["New York is one of _____ cities in the USA. (populated)", "the most populated"], ["The CN Tower is _____ building in this exercise. (tall)", "the tallest"], ["January is _____ month in Toronto. (cold)", "the coldest"], ["Sydney is one of _____ cities in Australia. (famous)", "the most famous"], ["Auckland is one of _____ cities in New Zealand. (big)", "the biggest"], ["Summer is _____ season in Sydney. (hot)", "the hottest"], ["New York is one of _____ cities in the USA. (populated)", "the most populated"], ["London is _____ city in this exercise. (busy)", "the busiest"], ["Edinburgh is _____ city in this exercise. (old)", "the oldest"], ["Auckland is _____ city in this exercise. (green)", "the greenest"], ["Sydney is _____ city in this exercise. (warm)", "the warmest"], ["The Shard is one of _____ buildings in London. (famous)", "the most famous"], ["Toronto is one of _____ cities in Canada. (cold)", "the coldest"], ["Melbourne is one of _____ cities in Australia. (lively)", "the liveliest"], ["London is one of _____ cities in the world. (famous)", "the most famous"], ["Sydney is one of _____ cities in Australia. (beautiful)", "the most beautiful"], ["Auckland is one of _____ cities in New Zealand. (modern)", "the most modern"], ["New York is one of _____ cities in the USA. (big)", "the biggest"], ["Edinburgh is one of _____ cities in Scotland. (interesting)", "the most interesting"], ["The CN Tower is one of _____ buildings in Toronto. (famous)", "the most famous"], ["July is one of _____ months in London. (warm)", "the warmest"], ["The Shard is one of _____ buildings in the UK. (tall)", "the tallest"], ["Toronto is one of _____ cities in Canada. (populated)", "the most populated"], ["Melbourne is one of _____ cities in Australia. (green)", "the greenest"], ["London is one of _____ cities in England. (old)", "the oldest"]], [["Toronto est plus froide que Sydney.", "Toronto is colder than Sydney."], ["Londres est plus grande qu’Édimbourg.", "London is bigger than Edinburgh."], ["Auckland a moins d’habitants que Londres.", "Auckland has fewer inhabitants than London."], ["Sydney est plus moderne qu’Édimbourg.", "Sydney is more modern than Edinburgh."], ["New York a plus de gratte-ciel que Toronto.", "New York has more skyscrapers than Toronto."], ["Londres est la ville la plus peuplée du Royaume-Uni.", "London is the most populated city in the UK."], ["Janvier est le mois le plus froid à Toronto.", "January is the coldest month in Toronto."], ["Sydney est l’une des villes les plus célèbres d’Australie.", "Sydney is one of the most famous cities in Australia."], ["Londres est plus grande qu’Auckland.", "London is bigger than Auckland."], ["Toronto est plus froide que Melbourne.", "Toronto is colder than Melbourne."], ["Sydney est plus chaude qu’Édimbourg.", "Sydney is hotter than Edinburgh."], ["La CN Tower est plus haute que le Shard.", "The CN Tower is taller than the Shard."], ["Auckland est plus verte que Toronto.", "Auckland is greener than Toronto."], ["Melbourne est plus animée qu’Édimbourg.", "Melbourne is livelier than Edinburgh."], ["New York est plus peuplée qu’Auckland.", "New York is more populated than Auckland."], ["Le Shard est plus petit que la CN Tower.", "The Shard is shorter than the CN Tower."], ["Sydney est plus moderne que Toronto.", "Sydney is more modern than Toronto."], ["Londres est plus vieille que Sydney.", "London is older than Sydney."], ["À mon avis, Auckland est meilleure que Toronto.", "In my opinion, Auckland is better than Toronto."], ["Édimbourg est plus petite que Londres.", "Edinburgh is smaller than London."], ["Toronto est plus grande qu’Édimbourg.", "Toronto is bigger than Edinburgh."], ["Melbourne est plus chaude que Toronto.", "Melbourne is warmer than Toronto."], ["New York est plus animée que Toronto.", "New York is livelier than Toronto."], ["Londres est l’une des villes les plus célèbres.", "London is one of the most famous cities."], ["Sydney est l’une des villes les plus chaudes d’Australie.", "Sydney is one of the hottest cities in Australia."], ["Janvier est le mois le plus froid à Toronto.", "January is the coldest month in Toronto."], ["La CN Tower est l’un des bâtiments les plus hauts de Toronto.", "The CN Tower is one of the tallest buildings in Toronto."], ["Auckland est l’une des villes les plus vertes.", "Auckland is one of the greenest cities."], ["Londres est une des villes les plus peuplées du Royaume-Uni.", "London is one of the most populated cities in the UK."], ["Édimbourg est plus vieille que Toronto, mais elle est plus petite.", "Edinburgh is older than Toronto, but it is smaller."]]];
const titles=['Exercise 1 – Complete with the comparative','Exercise 2 – Complete with the superlative','Exercise 3 – Translate into English'];
const samples=[];const attempts={};
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim().replace(/\bnew york city\b/g,'new york').replace(/\bthe united kingdom\b/g,'the uk').replace(/\bunited kingdom\b/g,'the uk').replace(/\bengland\b/g,'england');}
function variants(s){let a=new Set([norm(s)]);for(let pass=0;pass<2;pass++){for(const x of [...a]){let y=x.replace(/\bit is\b/g,"it's").replace(/\bis not\b/g,"isn't");a.add(y);a.add(x.replace(/\bit's\b/g,'it is'));a.add(x.replace(/\bmore inhabitants\b/g,'more people'));a.add(x.replace(/\bfewer inhabitants\b/g,'fewer people'));a.add(x.replace(/\bthe uk\b/g,'the united kingdom'));a.add(x.replace(/\bthe most populated\b/g,'the most populous'));a.add(x.replace(/\bin my opinion\b/g,'i think'));}}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pick(pool){let a=[...pool];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,10);}
function build(k){samples[k]=pick(pools[k]);let holder=document.getElementById('e'+k);holder.innerHTML=samples[k].map((q,i)=>`<div class="question" id="q${k}-${i}"><label for="a${k}-${i}"><strong>${i+1}.</strong> ${esc(q[0])}</label><input id="a${k}-${i}" type="text" autocomplete="off" spellcheck="false" aria-label="Answer ${i+1}"><div class="feedback" id="f${k}-${i}" aria-live="polite"></div></div>`).join('');document.getElementById('score'+k).textContent='';for(let i=0;i<10;i++)attempts[k+'-'+i]=0;}
function hint(input,correct,k){let a=norm(input),b=norm(correct);if(k===0){if(!a.includes('than'))return 'Remember: a comparative needs THAN.';if(b.includes('more ')&&!a.includes('more '))return 'Check the long adjective or quantity: MORE + word + THAN.';if(b.includes('better')&&!a.includes('better'))return 'GOOD has an irregular comparative: BETTER.';return 'Check the adjective spelling (-er, doubled consonant, or -ier).';}if(k===1){if(!a.includes('the'))return 'Remember THE before a superlative.';if(b.includes('most ')&&!a.includes('most '))return 'Long adjective: THE MOST + adjective.';if(b.includes('best')&&!a.includes('best'))return 'GOOD → THE BEST.';return 'Check the superlative spelling (-est, -iest, doubled consonant).';}if(b.includes('but')&&!a.includes('but'))return 'Do not forget BUT to connect the two ideas.';if(b.includes('one of')&&!a.includes('one of'))return 'Remember ONE OF THE + superlative + plural noun.';if(b.includes('than')&&!a.includes('than'))return 'A comparative needs THAN.';if(b.includes('fewer')&&!a.includes('fewer'))return 'With inhabitants (countable), use FEWER ... THAN.';if(b.includes('most')&&!a.includes('most'))return 'Use THE MOST with a long adjective.';return 'Check the comparative/superlative, the subject and the word order.';}
function check(k){let correctCount=0;for(let i=0;i<10;i++){const id=k+'-'+i,q=samples[k][i],input=document.getElementById('a'+id),fb=document.getElementById('f'+id);if(input.disabled){correctCount++;continue;}let v=input.value.trim();if(!v){fb.innerHTML='<span class="warn">Write an answer first.</span>';continue;}if(variants(q[1]).has(norm(v))){input.disabled=true;fb.innerHTML='<span class="ok">✓ Correct!</span>';correctCount++;continue;}attempts[id]++;const n=attempts[id];fb.innerHTML='<span class="warn">△ Try again ('+n+'/3). '+esc(n===1?'Look at the comparative or superlative form.':hint(v,q[1],k))+'</span>'+(n>=3?'<div><button type="button" class="reveal" data-k="'+k+'" data-i="'+i+'">Show answer</button></div>':'');}document.getElementById('score'+k).textContent=correctCount+'/10 correct';}
function reveal(k,i){let fb=document.getElementById('f'+k+'-'+i);fb.innerHTML+='<div class="model">Suggested answer: '+esc(samples[k][i][1])+'</div>';fb.querySelector('.reveal')?.remove();}
document.getElementById('app').innerHTML=titles.map((t,k)=>`<section class="card"><h2>${t}</h2><p class="muted">${k===2?'Write the complete English sentence.':'Complete only the missing words.'} 10 random questions from a pool of 30.</p><div id="e${k}"></div><button type="button" class="check" data-check="${k}">Check answers</button><button type="button" class="retry" data-retry="${k}">Try again</button><p class="score" id="score${k}" aria-live="polite"></p></section>`).join('');
document.getElementById('app').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.check!==undefined)check(+b.dataset.check);if(b.dataset.retry!==undefined)build(+b.dataset.retry);if(b.classList.contains('reveal'))reveal(+b.dataset.k,+b.dataset.i);});for(let k=0;k<3;k++)build(k);
</script></body></html>
