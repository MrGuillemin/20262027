<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4E3 – Unit 1 – Lesson A</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:24px;line-height:1.45;background:#f7f7f8;color:#222}h1,h2{margin-bottom:.4rem}.card{background:#fff;padding:20px;margin:18px 0;border-radius:12px;box-shadow:0 2px 10px #0001}.q{padding:12px 0;border-bottom:1px solid #eee}.q:last-child{border:0}button,select{font:inherit;padding:7px 10px;margin:4px;border-radius:7px;border:1px solid #bbb}button{cursor:pointer;background:#222;color:#fff}.feedback{font-weight:bold;margin-left:8px}.ok{color:#167a35}.no{color:#b42318}.score{font-weight:bold;margin-top:14px}.hint{color:#666;font-size:.95rem}</style></head><body><h1>4E3 – Unit 1 – Lesson A</h1><p>Revision exercises. Each exercise gives you 10 questions. Correct your answers, then try again for a new selection.</p><div id="app"></div><script>

function sample(a,n=10){return [...a].sort(()=>Math.random()-.5).slice(0,n)}
function render(){const app=document.getElementById('app');app.innerHTML='';sets.forEach((s,si)=>{let chosen=sample(s.items);const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${s.title}</h2><p class="hint">Choose the correct answer.</p>`;const box=document.createElement('div');chosen.forEach((it,i)=>{let q=document.createElement('div');q.className='q';let opts=s.type==='choice'?s.choices:it[1], ans=s.type==='choice'?it[1]:it[2];q.innerHTML=`<strong>${i+1}.</strong> ${it[0]} <select><option value="">— choose —</option>${opts.map(x=>`<option>${x}</option>`).join('')}</select><span class="feedback"></span>`;q.dataset.answer=ans;box.appendChild(q)});card.appendChild(box);let controls=document.createElement('div');controls.innerHTML='<button class="check">Check answers</button><button class="again">Try again</button><span class="score"></span>';card.appendChild(controls);controls.querySelector('.check').onclick=()=>{let score=0;[...box.children].forEach(q=>{let v=q.querySelector('select').value,f=q.querySelector('.feedback'),a=q.dataset.answer;if(v===a){score++;f.textContent='✓';f.className='feedback ok'}else{f.textContent=`✗ → ${a}`;f.className='feedback no'}});controls.querySelector('.score').textContent=` Score: ${score}/10`};controls.querySelector('.again').onclick=render;app.appendChild(card)})}
render();
