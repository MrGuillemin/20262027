function translationExercise(){

function chronology(){const correct=trips[Math.floor(Math.random()*trips.length)], mixed=shuffle(correct.map((t,i)=>({t,i})));const box=document.createElement('section');box.className='card';box.innerHTML='<h2>Exercise 4 — Put the road trip in order</h2><p>Put the stages in the correct order. Choose each chronological link word once.</p><div class="wordbank">First – Then – Next – After that – Finally</div>';const words=['First','Then','Next','After that','Finally'];mixed.forEach((x,j)=>{let d=document.createElement('div');d.className='stage';d.dataset.idx=x.i;d.innerHTML=`<select><option value="">Choose…</option>${words.map((w,i)=>`<option value="${i}">${w}</option>`).join('')}</select> ${x.t} <span class="feedback"></span>`;box.appendChild(d)});let s=document.createElement('div');s.className='score';let b=document.createElement('button');b.textContent='Check answers';b.onclick=()=>{let n=0;box.querySelectorAll('.stage').forEach(d=>{let ok=+d.querySelector('select').value===+d.dataset.idx && d.querySelector('select').value!=='';let f=d.querySelector('.feedback');f.textContent=ok?'✓':'✗';f.className='feedback '+(ok?'ok':'bad');if(ok)n++});s.textContent=`Score: ${n}/5`};let r=document.createElement('button');r.textContent='Try another road trip';r.onclick=()=>location.reload();box.append(b,r,s);return box}
